# ==========================================
# Server Configuration
# ==========================================
server.port=8080

# ==========================================
# MySQL Database Configurations
# ==========================================
# We connect to database named 'employee_db'.
# 'allowPublicKeyRetrieval=true' & 'useSSL=false' are added to prevent common connection issues in development.
spring.datasource.url=jdbc:mysql://localhost:3306/employee_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
# Change the password below to match your local MySQL root password!
spring.datasource.password=Root

# ==========================================
# Spring Data JPA & Hibernate Configuration
# ==========================================
# Dialect assists Hibernate in generating the correct SQL syntax for MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# 'update' automatically updates the schema in MySQL when the application boots up.
# This means you don't need to manually create the employees table!
spring.jpa.hibernate.ddl-auto=update

# Output all queries generated by Hibernate to the terminal (useful for learning and debugging)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
